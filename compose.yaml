# The whole thing, on one command.
#
# ADR-0005 §7: `docker compose up` brings up everything a merchant's engineer
# would look at — the landing, the documentation and the gateway, all
# on http://localhost:8080, with one Postgres behind them (ADR-0003 §6).
# Nothing here needs a build on the host first: the documentation is built
# inside its image and the two Node processes run their TypeScript through tsx,
# the same way `pnpm --filter @coinslot/gateway start` does on a laptop.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The database volume outlives `docker compose down`; `down -v` starts from
# nothing. Migrations run as their own service before the gateway, so an
# existing database is brought up to date rather than found to be a version
# behind on the first query.
#
# The cabinet is the one thing not here yet: it is being written, and the
# route to it in deploy/Caddyfile answers with a bad gateway until its service
# joins this file.
#
# The passwords and the key are in this file and that is deliberate. This
# stack holds a developer's own test orders and talks to a test network, and a
# secret that has to be found somewhere else to bring up a sandbox is a secret
# people paste into chat. Nothing here is a value any deployment reuses.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coinslot
      POSTGRES_PASSWORD: coinslot
      POSTGRES_DB: coinslot
    ports:
      # Published so that `pnpm test:db` and a psql from the terminal reach the
      # same database the containers use.
      - "5432:5432"
    volumes:
      - coinslot-postgres:/var/lib/postgresql/data
    healthcheck:
      # The gateway's first query is what would otherwise discover that the
      # server is up and the database is not ready yet.
      test: ["CMD-SHELL", "pg_isready -U coinslot -d coinslot"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Its own service rather than a line in the gateway's startup: a migration
  # that runs inside the process it is migrating for runs once per replica and
  # races itself. Here it runs to completion, and the gateway waits for it.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command: ["pnpm", "--filter", "@coinslot/gateway", "db:migrate"]
    environment:
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command: ["pnpm", "--filter", "@coinslot/gateway", "start"]
    environment:
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
      PORT: "3000"
      MERCHANT_API_KEY: local-sandbox-merchant-key
      # The address an agent is sent back to in order to pay, which is the door
      # Caddy answers and not the port this process listens on. Given the
      # process's own port here, a payment challenge would name a door that is
      # closed from outside.
      PUBLIC_BASE_URL: http://localhost:8080
      # No chain behind this stack (ADR-0008). Payments are verified and settled
      # against nothing, so a purchase completes here with no network, no wallet
      # and no faucet — which is what makes the cabinet worth opening. The
      # gateway says so in one line at startup.
      FACILITATOR_URL: sandbox:scripted
      # A challenge has to name somewhere for the money to go or it cannot be
      # built at all, so this is here to give the document a shape. Nothing ever
      # arrives at it: it is the second well-known local-devnet account, public
      # and valueless, and this gateway settles against nothing anyway.
      PAY_TO_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:8080"
    volumes:
      # The landing and the routing are mounted over the copies baked into the
      # image so that editing either shows up on reload. The documentation is
      # not: it is a build, and it comes from the image.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing/public:/srv/landing:ro
    depends_on:
      gateway:
        condition: service_started

volumes:
  coinslot-postgres:

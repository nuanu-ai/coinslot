# The whole thing, on one command.
#
# ADR-0005 §7: `docker compose up` brings up everything a merchant's engineer
# would look at — the landing, the documentation, the cabinet and the
# gateway, all on http://localhost:8080, with one Postgres behind them (ADR-0003 §6).
# Nothing here needs a build on the host first: the documentation is built
# inside its image, and the four services that share one image — the
# migration, the gateway, the cabinet and the mock merchant — run their
# TypeScript through tsx, the same way `pnpm --filter @coinslot/gateway start`
# does on a laptop.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The database volume outlives `docker compose down`; `down -v` starts from
# nothing. Migrations run as their own service before the gateway, so an
# existing database is brought up to date rather than found to be a version
# behind on the first query.
#
# The suite that needs a real database runs against a database of its own,
# `coinslot_test`, on this same server. It needs the server and nothing else
# from this file:
#
#   docker compose up -d --wait postgres
#   pnpm test:db
#
# `--wait` holds the command until the healthcheck below has passed, and naming
# the service matters: `docker compose up -d` with nothing after it starts all
# six of these. Nothing needs to be set for the suite to find its database — it
# makes it if it is not there — as long as the server is on the 5432 this file
# publishes it on. A host that publishes it somewhere else names it in
# COINSLOT_TEST_DATABASE_URL, which the suite reads from the command rather than
# from the `.env` below. Pointing either that or DATABASE_URL at `coinslot` is
# refused rather than obeyed, because that is the database the cabinet is
# showing and this suite empties what it is given.
#
# Two runs of the suite at once still interfere: they share the names of the
# tables they empty and the schemas they drop, so each pulls the ground out from
# under the other. One run at a time, per database.
#
# Nobody can sign into the cabinet until somebody makes an account. There is no
# sign-up page and no reset by mail yet (ADR-0009): one merchant, and we make
# the account by hand. One command, against the stack that is already up, which
# prints a generated password once:
#
#   docker compose exec cabinet \
#     pnpm --filter @coinslot/cabinet account add you@example.com
#
# Then http://localhost:8080/cabinet takes that address and that password. The
# same command has three more verbs — `list`, `password`, `revoke` — and running
# it with none of them prints them.
#
# Nothing is bought by itself. The merchant publishes its catalogue and waits;
# a purchase is an explicit command, so a sale in the cabinet is one somebody
# made:
#
#   pnpm buy                      # the first card in the catalogue
#   pnpm buy esim                 # the asynchronous one
#
# The passwords and the key are in this file and that is deliberate. This
# stack holds a developer's own test orders and talks to a test network, and a
# secret that has to be found somewhere else to bring up a sandbox is a secret
# people paste into chat. Nothing here is a value any deployment reuses.
#
# ## The same file on a server
#
# Every value a deployment has to change is a variable with the laptop's answer
# as its default, and a deployment sets them in a `.env` beside this file rather
# than editing a copy of it — the same shape deploy/Caddyfile already uses.
#
#   COINSLOT_SITE_ADDRESS   what Caddy listens on            :8080
#   COINSLOT_PUBLIC_ORIGIN  what a browser types             http://localhost:8080
#   COINSLOT_WEB_PUBLISH    the published port of the door   8080:8080
#   COINSLOT_COOKIE_SECURE  Secure on the session cookie     false
#   COINSLOT_FACILITATOR_URL  how payments are facilitated   sandbox:scripted
#   COINSLOT_PAYMENT_NETWORK  the chain payments use         eip155:84532
#   COINSLOT_MERCHANT_KEY   the key the mock merchant        csk_test_local-sandbox-merchant-key
#                           sells with
#   COINSLOT_SEED_KEY       the key the gateway writes at    csk_test_local-sandbox-merchant-key
#                           start-up, or nothing at all
#   COINSLOT_INVITATION     the code registration is         register-on-this-laptop
#                           behind, or nothing at all
#   COINSLOT_POSTGRES_PUBLISH  the published port of the     5432:5432
#                           database, or a narrower bind
#
# The first three move together and there is no arithmetic between them: an
# origin behind an edge that terminates TLS elsewhere is not derivable from a
# published port. Setting one and forgetting another is the mistake this file
# has already made once — a challenge naming a door that answers nothing — so
# they are written next to each other in one file where the mismatch is visible.
#
# On a host reached over https, COINSLOT_COOKIE_SECURE must be "true", and the
# key must not be the one printed above: it is in a repository, and a merchant
# key opens that merchant's cards, orders and receipts.
#
# The last two are one string on a laptop and two different things on a server,
# which is why they are two variables. Seeding is what makes `docker compose up`
# come up selling with nothing run by hand: at start the gateway hangs a row for
# that key on the sandbox's merchant, if there is not one there already. A
# second boot writes nothing, and a key disabled at a terminal is left disabled
# — revoking one is not a thing a restart undoes.
#
# A stack on a server is seeded too, with a key of its own: one generated for
# that host, kept in its `.env`, and carrying the prefix of the site it is for —
# `csk_test_` on the test site, `csk_live_` on the live one. The door reads that
# prefix before it looks anything up, so a key carrying the other site's is
# turned away there whatever the database holds, and a key seeded under the
# wrong prefix opens nothing on the host it was seeded into.
#
# What a key kept in a file cannot do is go away: disabling its row stops it
# opening anything, but the string is still in the file the gateway is handed at
# every start, so retiring it is an edit and a deployment rather than a row
# disabled, and a database brought up from nothing is seeded off that same line
# again. That is the reason to stop seeding once nothing presents that key any
# more — once whatever sells on that host has a key of its own, issued with
# `merchant key` and put in COINSLOT_MERCHANT_KEY, the deployment sets seeding
# to nothing:
#
#   COINSLOT_SEED_KEY=
#
# The gateway reads a name set to nothing as a name never set, and says at
# start-up which of the two it did.
#
# COINSLOT_INVITATION is the code somebody has to type to register a merchant
# here (ADR-0014 §3). On a laptop it is a word in this file, so `docker compose
# up` gives a stack anybody can sign up on; a deployment hands out a code of its
# own, and a deployment that wants no registrations at all sets it to nothing:
#
#   COINSLOT_INVITATION=
#
# The gateway then refuses every registration, in the same words and the same
# status a wrong code gets — so the form is not a way of asking whether
# registration is open here.

# One image behind four of the services below. They are four entry points into
# one workspace and share every dependency below their own file, so which one a
# container is is decided at `command` — and naming the image explicitly is what
# makes that true in practice as well as on paper. Without it compose builds the
# same Dockerfile once per service and tags the result four times, which is
# 2.7 GB of identical layers where 678 MB would do.
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile.app
  image: "${COINSLOT_APP_IMAGE:-coinslot-app}"
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coinslot
      POSTGRES_PASSWORD: coinslot
      POSTGRES_DB: coinslot
    ports:
      # Published so that `pnpm test:db` and a psql from the terminal reach this
      # server. They reach a different database on it: the suite empties what it
      # is given, and `coinslot` is what the cabinet is showing.
      #
      # A deployment binds it to the loopback instead — `127.0.0.1:55432:5432`
      # — because the password above is in a repository and nothing off the host
      # has any business reaching this database. Not left empty: compose refuses
      # an empty entry rather than dropping it, so the variable always names a
      # mapping and a deployment's answer is a narrower one. A suite run from a
      # terminal on such a host is told the port it moved to in
      # COINSLOT_TEST_DATABASE_URL; the release script runs it inside this
      # network, where the port above is not involved at all.
      - "${COINSLOT_POSTGRES_PUBLISH:-5432:5432}"
    volumes:
      - coinslot-postgres:/var/lib/postgresql/data
      # Makes `coinslot_test` beside `coinslot` on a volume that is new. On one
      # that is not — which is every volume that has ever run this stack —
      # Postgres does not look at this directory at all, and the suite makes its
      # own database instead. See deploy/postgres-init/01-test-database.sql.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The gateway's first query is what would otherwise discover that the
      # server is up and the database is not ready yet.
      test: ["CMD-SHELL", "pg_isready -U coinslot -d coinslot"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Its own service rather than a line in either process's startup: a migration
  # that runs inside the process it is migrating for runs once per replica and
  # races itself. Here it runs to completion, and both processes wait for it.
  #
  # Two sets of migrations run here, the gateway's tables and the cabinet's two.
  # They are separate because they belong to separate processes and keep
  # separate histories (ADR-0009 §8); they are one service because they are one
  # database and one thing to wait for.
  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    <<: *app
    command: ["pnpm", "--filter", "@coinslot/gateway", "start"]
    environment:
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
      PORT: "3000"
      # The key this sandbox comes up selling with. Keys are rows in the
      # database (ADR-0010), and this is not one the gateway compares anything
      # against: on start it makes sure a row for this key exists on the
      # merchant every card, order and receipt here belongs to, so that the two
      # services below are recognised without anybody running a command. A
      # second boot writes nothing, and a key disabled at a terminal stays
      # disabled. A deployment sets this too, to a key generated for that host
      # and carrying that site's prefix, because the merchant service below
      # reads its key out of a file and has nothing to present until a row for
      # it exists; a person registering with an invitation needs none of it. It
      # is unset once nothing presents that key any more — once whatever sells
      # there has a key of its own. Its own variable rather than
      # the one the cabinet presents, because the two part company on a server:
      # this one is read from a file at every start and put back into the
      # database whenever the row is missing, which is what makes it a key
      # nobody can retire without a deployment. Set to nothing, this process
      # writes no key and every key is one somebody issued.
      #
      # The dash carries no colon on purpose: `${VAR-default}` gives the default
      # only when nobody named the variable, so a deployment naming it with
      # nothing after it gets nothing rather than the sandbox's key back.
      SANDBOX_MERCHANT_KEY: "${COINSLOT_SEED_KEY-csk_test_local-sandbox-merchant-key}"
      # The code that stands in the door of registration. Nobody registering has
      # a key yet, so this is what is between a stranger who finds the hostname
      # and a merchant of their own — and the catalogue is one across merchants,
      # so an open form would put a stranger's words in front of every buyer.
      # A word in this file on a laptop, for the reason the password above it is:
      # this stack holds a developer's own test orders and talks to nothing real.
      #
      # The dash carries no colon for the same reason the line above it does:
      # `${VAR-default}` gives the default only when nobody named the variable,
      # so a deployment naming it with nothing after it takes no registrations
      # rather than getting this word back.
      REGISTRATION_INVITATION: "${COINSLOT_INVITATION-register-on-this-laptop}"
      # The address an agent is sent back to in order to pay, which is the door
      # Caddy answers and not the port this process listens on. Given the
      # process's own port here, a payment challenge would name a door that is
      # closed from outside.
      # Follows the published port, because this address is not decoration: it
      # is what a payment challenge tells an agent to come back to, and what a
      # catalogue keys a listing on. Left at 8080 while the stack was moved to
      # another port, every challenge named a door that answers nothing.
      #
      # Behind an edge that terminates TLS somewhere else this stops following
      # the port at all — the origin is https on 443 and the host publishes
      # whatever it publishes — which is why a deployment names the origin
      # itself rather than a number this line does arithmetic on.
      PUBLIC_BASE_URL: "${COINSLOT_PUBLIC_ORIGIN:-http://localhost:${COINSLOT_HOST_PORT:-8080}}"
      # The laptop's values are the defaults, and they are the reason this is a
      # variable at all: no chain behind this stack (ADR-0008), so a purchase
      # completes here with no network, no wallet and no faucet. A public
      # deployment names its own pair in its `.env`, and the release preflight
      # holds each channel to the pair it declared — because a test chain must
      # keep accepting the scripted facilitator, so the runtime cannot make
      # this check for itself.
      FACILITATOR_URL: "${COINSLOT_FACILITATOR_URL:-sandbox:scripted}"
      PAYMENT_NETWORK: "${COINSLOT_PAYMENT_NETWORK:-eip155:84532}"
      # A challenge has to name somewhere for the money to go or it cannot be
      # built at all, so this is here to give the document a shape where the
      # merchant selling has set no address of their own — which is what a stack
      # brought up from nothing looks like, and is allowed only here (ADR-0019).
      # Nothing ever arrives at it: it is the second well-known local-devnet
      # account, public and valueless, and this gateway settles against nothing.
      PAY_TO_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      # Fifteen and not twenty, because of the line below it. A process starting
      # through tsx refuses connections for the first few seconds and those
      # refusals are not news, so `start_period` stops them being counted — but
      # it also postpones the verdict by its own length, and the verdict is what
      # `web` waits for before it comes up without this service. Fifteen retries
      # after a fifteen-second grace is the same minute a dependency had to
      # become healthy in before either line was here.
      retries: 15
      start_period: 15s

  cabinet:
    <<: *app
    command: ["pnpm", "--filter", "@coinslot/cabinet", "start"]
    environment:
      PORT: "3001"
      # The cabinet's own two tables: the people who sign in and their sessions
      # (ADR-0009). The same server and the same database as the gateway's, and
      # nothing about a merchant's data — every card, order and receipt on every
      # screen still comes from the API.
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
      # What signs a merchant's session cookie. The component behind the sign-in
      # ships a fallback of its own, and a deployment that leans on it signs
      # sessions with a value out of somebody else's public source — so the
      # cabinet refuses to start without this one rather than quietly taking
      # theirs. The value below is this sandbox's, in this file, for the reason
      # every other secret here is in this file; a deployment sets its own.
      # Changing it signs everybody out and does nothing worse: an account is
      # reached again by signing in.
      AUTH_SECRET: "${COINSLOT_AUTH_SECRET:-a-sandbox-secret-nobody-should-reuse-anywhere}"
      # The address a merchant reaches this cabinet at, which is what the links
      # in a confirmation or a password reset are built on. Nothing else needs
      # it — every link on every page is relative — but a message is read on
      # another machine, so those two have to be absolute.
      #
      # It is the origin and not the mount point: the cabinet appends its own
      # base path. A deployment that sends real mail and leaves this at the
      # laptop's answer is refused at startup, because every link it sent would
      # point at the reader's own computer.
      PUBLIC_BASE_URL: "${COINSLOT_PUBLIC_ORIGIN:-http://localhost:${COINSLOT_HOST_PORT:-8080}}"
      # How a message leaves, or that it does not. `sandbox:log` writes every
      # message into this service's log with its recipient and its link, so the
      # whole path — register, confirm, lose a password, set a new one — is
      # walked on a laptop with no account, no domain and no network. The same
      # shape as the gateway's facilitator: one field, one value, and a
      # configuration naming a real provider cannot also be pretending.
      MAIL_URL: "${MAIL_URL:-sandbox:log}"
      MAIL_API_KEY: "${MAIL_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-Coinslot <no-reply@localhost>}"
      # The same two its gateway reads. The cabinet gives them no defaults of
      # its own and refuses to start without them; these lines are what a
      # compose deployment hands it.
      FACILITATOR_URL: "${COINSLOT_FACILITATOR_URL:-sandbox:scripted}"
      PAYMENT_NETWORK: "${COINSLOT_PAYMENT_NETWORK:-eip155:84532}"
      # There is no merchant key here, and its absence is the point rather than
      # an omission. The cabinet used to be given one and use it for the life of
      # the process, so every screen showed that merchant's money whoever was
      # signed in; the key is on the row of the person signed in now (ADR-0014
      # §2), which is what makes two accounts here two merchants. A stack that
      # still sets MERCHANT_API_KEY on this service is setting a name nothing
      # reads.
      #
      # Off by default, because this stack is plain http on localhost, where a
      # Secure cookie is never sent back and nobody can sign in at all. Anywhere
      # the cabinet is reached over https this is "true", and a server that
      # leaves it off is handing a merchant's session to anybody on the path.
      COOKIE_SECURE: "${COINSLOT_COOKIE_SECURE:-false}"
      # Its own process, reaching the gateway over the same public API a
      # merchant's own code uses (ADR-0005 §2) — this is the service name on the
      # internal network, not the origin a browser types.
      GATEWAY_URL: http://gateway:3000
      # Caddy passes /cabinet through without stripping it, so the process sees
      # the path the browser asked for and builds its links from the same string
      # (deploy/Caddyfile).
      BASE_PATH: /cabinet
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    healthcheck:
      # The cabinet answers a probe at the bare root as well as under its mount
      # point, and this is the thing that was supposed to be asking. Without it
      # the code carried a route for a caller that did not exist, and Caddy went
      # up in front of a process that had not finished starting.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      # As above, and for the same arithmetic: fifteen seconds of grace and
      # fifteen retries after it is the minute a dependency had before.
      retries: 15
      start_period: 15s

  # A merchant on the other side, so the surface has something to show. It is
  # the mock merchant of the offline gate — the same two cards, the same price
  # desk, the same handlers — pointed at this gateway instead of one booted in
  # its own process, which makes it the code a merchant's engineer would write
  # rather than a demonstration written to look like it.
  merchant:
    <<: *app
    command: ["pnpm", "--filter", "@coinslot/slice", "serve"]
    environment:
      GATEWAY_URL: http://gateway:3000
      # The same key the gateway seeds above: one merchant, one key, and on a
      # laptop one string in both places. Left behind when the other became a
      # variable, this service would go on presenting a key the gateway no
      # longer knows and the catalogue would come up empty.
      #
      # The dash carries no colon for the reason SANDBOX_MERCHANT_KEY and
      # REGISTRATION_INVITATION give above, and the three part company on what
      # an empty value then means. Seeding set to nothing writes no key, and an
      # invitation set to nothing takes no registrations; this has no such mode.
      # Named with nothing after it, the merchant refuses to start —
      # "MERCHANT_API_KEY is not set … there is no default for it" — which is
      # what a deployment that emptied the variable should get, rather than the
      # key printed in this file quietly selling on a server.
      MERCHANT_API_KEY: "${COINSLOT_MERCHANT_KEY-csk_test_local-sandbox-merchant-key}"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # This one has no port to ask. The merchant is a long poll and nothing
      # else, so `running` was the whole of what this service ever said, and it
      # says that just as readily about a process whose worker ended on a
      # version mismatch and has been deaf ever since. So the process writes one
      # line about its own subscription and this reads it: the line has to say
      # it is selling, and the file has to have been written recently enough
      # that the loop writing it is still turning. Either alone can be true
      # while the other is not — a frozen process leaves a `selling` line behind
      # it, and a fresh file may say it is not getting through.
      #
      # The path is spelled here and in packages/slice/src/serve.ts, and neither
      # of them spells the directory: both ask the runtime for it, so the two
      # agree under whatever TMPDIR this service is given. Fifteen seconds is
      # generous against a line rewritten twice a second; it is a bound on a
      # stalled process, not a timing budget.
      #
      # It prints the line before it exits, whichever way it exits, because a
      # probe that fails silently reproduces the complaint that this whole
      # healthcheck is the answer to: `docker inspect` would say `unhealthy`
      # and give no reason, which is `running` again in a different word. What
      # it prints lands in .State.Health.Log, so the reason is in the same place
      # as the verdict.
      #
      # The strings are joined with `+` and not written as template literals,
      # which is not a matter of taste: compose substitutes `${...}` in this
      # value before Node ever sees it, so a template literal here becomes an
      # empty string and a warning at every `docker compose config`.
      #
      # What this can and cannot claim is written where the line is produced,
      # and the short of it is that a `selling` line means no poll has failed
      # in the last ninety seconds, not that the catalogue is still on the
      # shelf. The cost of that window is worth knowing before it surprises
      # somebody: a gateway restarted on purpose leaves this service red for up
      # to ninety seconds afterwards, because a worker that has just been
      # refused cannot tell a restart from an outage until the quiet has gone
      # on long enough to mean something.
      test:
        - CMD
        - node
        - -e
        - |
          const fs = require("node:fs");
          const p = require("node:path").join(require("node:os").tmpdir(), "coinslot-merchant-subscription");
          try {
            const line = fs.readFileSync(p, "utf8").trim();
            const age = Math.round((Date.now() - fs.statSync(p).mtimeMs) / 1000);
            console.log(line + " (written " + age + "s ago)");
            process.exit(age < 15 && line.startsWith("selling") ? 0 : 1);
          } catch (thrown) {
            console.log("cannot read " + p + ": " + thrown.message);
            process.exit(1);
          }
      interval: 5s
      timeout: 3s
      # Three in a row rather than one, and what they buy is narrower than it
      # looks. They do not bridge a dropped poll: one of those holds the line at
      # `doubting` for the whole window above, which is eighteen probes and not
      # three. What they cover is the probe itself failing to run — this spawns
      # a Node process every five seconds, and on a loaded machine one of those
      # can lose the three-second timeout while the merchant is perfectly well.
      # Nothing else is left to flap: the line is swapped into place by a rename
      # rather than a truncating write, so a probe can no longer catch the file
      # half written.
      retries: 3
      # The same grace its neighbours have, and for the same reason: this
      # process comes up through tsx, and it publishes its catalogue before it
      # writes the file at all.
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: "${COINSLOT_WEB_IMAGE:-coinslot-web}"
    restart: unless-stopped
    ports:
      # The host side is a variable because a laptop is not ours alone: an ssh
      # tunnel or another project can already hold 8080, and a tunnel bound to
      # 127.0.0.1 wins over Docker's wildcard for anything typed as localhost —
      # so the stack looks broken while being perfectly healthy. Set
      # COINSLOT_HOST_PORT to move it; the inside of the network never changes.
      #
      # It moves the stack and nothing else. The buy command above runs on the
      # host rather than in this file and reads none of these variables: it goes
      # to http://localhost:8080 unless GATEWAY_URL sends it somewhere else.
      #
      #   GATEWAY_URL=http://localhost:8090 pnpm buy
      #
      # A deployment sets the whole mapping instead, because both halves move at
      # once: Caddy listens on 443 rather than 8080 as soon as the address below
      # is a hostname, and the host side is one interface rather than every one
      # — `10.20.10.20:443:443` is a door open to the edge that passes SNI to it
      # and to nothing else on the machine.
      - "${COINSLOT_WEB_PUBLISH:-${COINSLOT_HOST_PORT:-8080}:8080}"
    environment:
      # A bare port locally, which is what keeps Caddy's automatic HTTPS off; a
      # hostname on a server, which is what turns it on. deploy/Caddyfile says
      # why TLS-ALPN is the only challenge that can reach it here.
      COINSLOT_SITE_ADDRESS: "${COINSLOT_SITE_ADDRESS:-:8080}"
    volumes:
      # The landing and the routing are mounted over the copies baked into the
      # image so that editing either shows up on reload. The documentation is
      # not: it is a build, and it comes from the image.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing/public:/srv/landing:ro
      # Where Caddy keeps the certificate and the ACME account key. A named
      # volume rather than the container's own layer because recreating the
      # container is a thing that happens, and a certificate authority counts
      # issuances: five for the same name in a week, and the sixth is refused
      # for the rest of it. Locally this directory stays empty — a bare port
      # runs no ACME at all.
      - coinslot-caddy:/data
    # Waited for, but not required. Caddy in front of a process that has not
    # finished starting answers 502 to the first person who looks, so waiting
    # for a health check rather than for a container is right — and a service
    # that never becomes healthy must not take this one down with it. Without
    # `required: false`, `docker compose up` aborts the whole command with
    # "dependency failed to start", and the landing and the documentation, which
    # need nothing from either of these, do not come up at all. They are the two
    # pages somebody reads while working out why the third is broken.
    #
    # What that costs when a dependency really is down: /cabinet and /v0 answer
    # 502 until it is up, and then they work, because Caddy resolves the service
    # name per request rather than at startup.
    depends_on:
      gateway:
        condition: service_healthy
        required: false
      cabinet:
        condition: service_healthy
        required: false

volumes:
  coinslot-postgres:
  coinslot-caddy:

# The whole thing, on one command.
#
# ADR-0005 §7: `docker compose up` brings up everything a merchant's engineer
# would look at — the landing, the documentation, the cabinet and the
# gateway, all on http://localhost:8080, with one Postgres behind them (ADR-0003 §6).
# Nothing here needs a build on the host first: the documentation is built
# inside its image and the two Node processes run their TypeScript through tsx,
# the same way `pnpm --filter @coinslot/gateway start` does on a laptop.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The database volume outlives `docker compose down`; `down -v` starts from
# nothing. Migrations run as their own service before the gateway, so an
# existing database is brought up to date rather than found to be a version
# behind on the first query.
#
# The suite that needs a real database runs against a database of its own,
# `coinslot_test`, on this same server. It needs the server and nothing else
# from this file:
#
#   docker compose up -d --wait postgres
#   pnpm test:db
#
# `--wait` holds the command until the healthcheck below has passed, and naming
# the service matters: `docker compose up -d` with nothing after it starts all
# six of these. Nothing needs to be set for the suite to find its database — it
# makes it if it is not there — and pointing DATABASE_URL at `coinslot` is
# refused rather than obeyed, because that is the database the cabinet is
# showing and this suite empties what it is given.
#
# Two runs of the suite at once still interfere: they share the names of the
# tables they empty and the schemas they drop, so each pulls the ground out from
# under the other. One run at a time, per database.
#
# Nobody can sign into the cabinet until somebody makes an account. There is no
# sign-up page and no reset by mail (ADR-0009): one merchant, and we make the
# account by hand. One command, against the stack that is already up, which
# prints a generated password once:
#
#   docker compose exec cabinet \
#     pnpm --filter @coinslot/cabinet account add you@example.com
#
# Then http://localhost:8080/cabinet takes that address and that password. The
# same command has three more verbs — `list`, `password`, `revoke` — and running
# it with none of them prints them.
#
# Nothing is bought by itself. The merchant publishes its catalogue and waits;
# a purchase is an explicit command, so a sale in the cabinet is one somebody
# made:
#
#   pnpm buy                      # the first card in the catalogue
#   pnpm buy esim-eu-5gb-30d      # the asynchronous one
#
# The passwords and the key are in this file and that is deliberate. This
# stack holds a developer's own test orders and talks to a test network, and a
# secret that has to be found somewhere else to bring up a sandbox is a secret
# people paste into chat. Nothing here is a value any deployment reuses.

# One image behind four of the services below. They are four entry points into
# one workspace and share every dependency below their own file, so which one a
# container is is decided at `command` — and naming the image explicitly is what
# makes that true in practice as well as on paper. Without it compose builds the
# same Dockerfile once per service and tags the result four times, which is
# 2.7 GB of identical layers where 678 MB would do.
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile.app
  image: coinslot-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coinslot
      POSTGRES_PASSWORD: coinslot
      POSTGRES_DB: coinslot
    ports:
      # Published so that `pnpm test:db` and a psql from the terminal reach this
      # server. They reach a different database on it: the suite empties what it
      # is given, and `coinslot` is what the cabinet is showing.
      - "5432:5432"
    volumes:
      - coinslot-postgres:/var/lib/postgresql/data
      # Makes `coinslot_test` beside `coinslot` on a volume that is new. On one
      # that is not — which is every volume that has ever run this stack —
      # Postgres does not look at this directory at all, and the suite makes its
      # own database instead. See deploy/postgres-init/01-test-database.sql.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The gateway's first query is what would otherwise discover that the
      # server is up and the database is not ready yet.
      test: ["CMD-SHELL", "pg_isready -U coinslot -d coinslot"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Its own service rather than a line in either process's startup: a migration
  # that runs inside the process it is migrating for runs once per replica and
  # races itself. Here it runs to completion, and both processes wait for it.
  #
  # Two sets of migrations run here, the gateway's tables and the cabinet's two.
  # They are separate because they belong to separate processes and keep
  # separate histories (ADR-0009 §8); they are one service because they are one
  # database and one thing to wait for.
  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    <<: *app
    command: ["pnpm", "--filter", "@coinslot/gateway", "start"]
    environment:
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
      PORT: "3000"
      # The key this sandbox comes up selling with. Keys are rows in the
      # database (ADR-0010), and this is not one the gateway compares anything
      # against: on start it makes sure a row for this key exists on the
      # merchant every card, order and receipt here belongs to, so that the two
      # services below are recognised without anybody running a command. A
      # second boot writes nothing, and a key disabled at a terminal stays
      # disabled. No deployment sets this — a key in an environment cannot be
      # revoked without a deployment, which is what moving keys into rows fixed.
      SANDBOX_MERCHANT_KEY: local-sandbox-merchant-key
      # The address an agent is sent back to in order to pay, which is the door
      # Caddy answers and not the port this process listens on. Given the
      # process's own port here, a payment challenge would name a door that is
      # closed from outside.
      # Follows the published port, because this address is not decoration: it
      # is what a payment challenge tells an agent to come back to, and what a
      # catalogue keys a listing on. Left at 8080 while the stack was moved to
      # another port, every challenge named a door that answers nothing.
      PUBLIC_BASE_URL: http://localhost:${COINSLOT_HOST_PORT:-8080}
      # No chain behind this stack (ADR-0008). Payments are verified and settled
      # against nothing, so a purchase completes here with no network, no wallet
      # and no faucet — which is what makes the cabinet worth opening. The
      # gateway says so in one line at startup.
      FACILITATOR_URL: sandbox:scripted
      # A challenge has to name somewhere for the money to go or it cannot be
      # built at all, so this is here to give the document a shape. Nothing ever
      # arrives at it: it is the second well-known local-devnet account, public
      # and valueless, and this gateway settles against nothing anyway.
      PAY_TO_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      # Fifteen and not twenty, because of the line below it. A process starting
      # through tsx refuses connections for the first few seconds and those
      # refusals are not news, so `start_period` stops them being counted — but
      # it also postpones the verdict by its own length, and the verdict is what
      # `web` waits for before it comes up without this service. Fifteen retries
      # after a fifteen-second grace is the same minute a dependency had to
      # become healthy in before either line was here.
      retries: 15
      start_period: 15s

  cabinet:
    <<: *app
    command: ["pnpm", "--filter", "@coinslot/cabinet", "start"]
    environment:
      PORT: "3001"
      # The cabinet's own two tables: the people who sign in and their sessions
      # (ADR-0009). The same server and the same database as the gateway's, and
      # nothing about a merchant's data — every card, order and receipt on every
      # screen still comes from the API.
      DATABASE_URL: postgres://coinslot:coinslot@postgres:5432/coinslot
      # The key the cabinet reaches the gateway with — the one the gateway
      # seeded above, which is what makes it resolve to the merchant whose cards
      # and receipts these screens show. It is here rather than typed into a
      # form by whoever is signing in: machine to machine, out of configuration.
      # Rotating it is now a separate act from signing anybody out.
      MERCHANT_API_KEY: local-sandbox-merchant-key
      # Off, and named rather than left to the default, because this is the one
      # line a deployment has to change. This stack is plain http on localhost,
      # where a Secure cookie is never sent back and nobody can sign in at all;
      # anywhere the cabinet is reached over https this is "true", and a server
      # that leaves it off is handing a merchant's session to anybody on the
      # path.
      COOKIE_SECURE: "false"
      # Its own process, reaching the gateway over the same public API a
      # merchant's own code uses (ADR-0005 §2) — this is the service name on the
      # internal network, not the origin a browser types.
      GATEWAY_URL: http://gateway:3000
      # Caddy passes /cabinet through without stripping it, so the process sees
      # the path the browser asked for and builds its links from the same string
      # (deploy/Caddyfile).
      BASE_PATH: /cabinet
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    healthcheck:
      # The cabinet answers a probe at the bare root as well as under its mount
      # point, and this is the thing that was supposed to be asking. Without it
      # the code carried a route for a caller that did not exist, and Caddy went
      # up in front of a process that had not finished starting.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      # As above, and for the same arithmetic: fifteen seconds of grace and
      # fifteen retries after it is the minute a dependency had before.
      retries: 15
      start_period: 15s

  # A merchant on the other side, so the surface has something to show. It is
  # the mock merchant of the offline gate — the same two cards, the same price
  # desk, the same handlers — pointed at this gateway instead of one booted in
  # its own process, which makes it the code a merchant's engineer would write
  # rather than a demonstration written to look like it.
  merchant:
    <<: *app
    command: ["pnpm", "--filter", "@coinslot/slice", "serve"]
    environment:
      GATEWAY_URL: http://gateway:3000
      MERCHANT_API_KEY: local-sandbox-merchant-key
    depends_on:
      gateway:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      # The host side is a variable because a laptop is not ours alone: an ssh
      # tunnel or another project can already hold 8080, and a tunnel bound to
      # 127.0.0.1 wins over Docker's wildcard for anything typed as localhost —
      # so the stack looks broken while being perfectly healthy. Set
      # COINSLOT_HOST_PORT to move it; the inside of the network never changes.
      - "${COINSLOT_HOST_PORT:-8080}:8080"
    volumes:
      # The landing and the routing are mounted over the copies baked into the
      # image so that editing either shows up on reload. The documentation is
      # not: it is a build, and it comes from the image.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing/public:/srv/landing:ro
    # Waited for, but not required. Caddy in front of a process that has not
    # finished starting answers 502 to the first person who looks, so waiting
    # for a health check rather than for a container is right — and a service
    # that never becomes healthy must not take this one down with it. Without
    # `required: false`, `docker compose up` aborts the whole command with
    # "dependency failed to start", and the landing and the documentation, which
    # need nothing from either of these, do not come up at all. They are the two
    # pages somebody reads while working out why the third is broken.
    #
    # What that costs when a dependency really is down: /cabinet and /v0 answer
    # 502 until it is up, and then they work, because Caddy resolves the service
    # name per request rather than at startup.
    depends_on:
      gateway:
        condition: service_healthy
        required: false
      cabinet:
        condition: service_healthy
        required: false

volumes:
  coinslot-postgres:

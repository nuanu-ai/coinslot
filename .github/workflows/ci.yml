name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading is enough for the checks: they must publish nothing and write nowhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs run on the org's own comino build pool: GitHub-hosted runners are
# unavailable on this org's Actions billing. The repo is private, so
# pull_request jobs only ever run code from people who already have write
# access to this repository.
jobs:
  # The monorepo checks walk the same install path, so they are described once
  # as a matrix: there is simply nowhere here for the Node versions or the
  # order of steps to drift apart between them. In the interface these are
  # still separate jobs — check, typecheck, test and build.
  #
  # `build` is here because `typecheck` does not cover it. The two compile
  # different sets of files: `typecheck` reads everything including the tests,
  # emits nothing and never looks at what would be shipped, while `build` uses
  # the narrower `tsconfig.build.json` that decides what lands in a tarball.
  # `pnpm outside`, which installs those tarballs and runs the command, needs
  # the registry, so it stays out of here for the same reason `pnpm smoke`
  # does.
  monorepo:
    name: ${{ matrix.task }}
    runs-on: [self-hosted, comino]
    strategy:
      fail-fast: false
      matrix:
        task: [check, typecheck, test, build]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # pnpm arrives through corepack, the version is taken from packageManager
      # in the root package.json — the same one the developer has on the machine.
      - run: corepack enable

      # The second setup-node pass turns on the pnpm cache: it cannot be turned
      # on earlier, the cache needs pnpm to be installed already.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.task }}

  # The tests that need a real Postgres, run by hand.
  #
  # They are `workflow_dispatch` rather than part of every push, and the reason
  # is a fact nobody has been able to check: the jobs above run on the org's own
  # self-hosted pool, and whether that pool supports service containers depends
  # on whether its runners have a Docker daemon. A job wired to run on every
  # push and failing on every push because the service never starts would be a
  # red build that says nothing. Somebody who can answer that question turns
  # this into an ordinary job by moving it under `push` and deleting this
  # paragraph.
  database:
    name: test:db
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, comino]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coinslot
          POSTGRES_PASSWORD: coinslot
          POSTGRES_DB: coinslot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coinslot -d coinslot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No DATABASE_URL and no migration step. The suite runs against
      # `coinslot_test` on the service above, makes that database if it is not
      # there, and applies the checked-in migrations itself before the first
      # test — which is the same code path a developer's run takes, so this job
      # is not exercising a second way of arriving at a schema.
      - run: pnpm test:db

  # The decision log needs neither Node nor dependencies — only bash and files.
  decisions:
    name: decisions
    runs-on: [self-hosted, comino]
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-decisions.sh

# What the monorepo is made of. `portal/` is deliberately left out: it is a
# separate vitepress project with its own lockfile and its own build, and
# pulling it into the shared install would tie the release of the
# documentation to the release of the code. `spikes/` is outside too — spikes
# live on their own dependencies and die together with their conclusions.
packages:
  - packages/*
  - apps/*

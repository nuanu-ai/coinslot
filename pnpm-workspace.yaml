# Состав монорепо. `portal/` сюда намеренно не входит: это отдельный
# vitepress-проект со своим локом и своей сборкой, и втягивать его в общий
# install значит связать выпуск документации с выпуском кода. `spikes/`
# тоже снаружи — спайки живут на своих зависимостях и умирают вместе с
# выводами.
packages:
  - packages/*
  - apps/*
